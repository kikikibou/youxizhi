<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏之西柚 · Jeu de pamplemousse</title>
    <meta name="description" content="辩论、谜题与小游戏的个人街区" />
    <!-- Pre-launch: keep search engines out until the real domain goes live. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div id="loader" class="loader">
      <div class="loader-inner">
        <span class="loader-word">PAMPLEMOUSSE</span>
        <span class="loader-bar"><i></i></span>
        <form class="gate" autocomplete="off">
          <label class="gate-label" for="gate-input">PRIVATE PREVIEW · 请输入口令</label>
          <span class="gate-row">
            <input id="gate-input" type="password" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="口令" />
            <button type="submit">进入 →</button>
          </span>
          <span class="gate-msg" aria-live="polite"></span>
        </form>
      </div>
    </div>

    <div class="ui">
      <header class="topbar">
        <a class="brand" href="#/home" data-nav="home">
          <span class="brand-box"></span>
          <span class="brand-text">
            <b>游戏之西柚</b>
            <small>JEU DE PAMPLEMOUSSE</small>
          </span>
        </a>
        <p class="credits">
          Debate · Puzzles · Games<br />
          A street corner built for thinking.<br />
          Every building is a different room of the mind.
        </p>
        <nav class="nav" id="nav"></nav>
        <button class="daynight" id="daynight" type="button" aria-label="切换昼夜">
          <span class="dn-track"><span class="dn-sun"></span><span class="dn-moon"></span></span>
          <span class="dn-label">DAY</span>
        </button>
        <div class="palette" id="palette">
          <button class="pal-btn" type="button" aria-haspopup="true" aria-expanded="false" title="切换配色（P）">
            <span class="pal-dots"></span><span class="pal-name">配色</span>
          </button>
          <div class="pal-menu" role="menu"></div>
        </div>
      </header>

      <main class="stage" id="stage"></main>

      <footer class="bottom" id="bottom"></footer>

      <div class="hint" id="hint">滚轮 / ← → 切换建筑</div>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-scrim" data-close></div>
      <div class="drawer-panel">
        <button class="drawer-close" type="button" data-close aria-label="关闭">×</button>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
