<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏之致西柚 · Jeu de pamplemousse</title>
    <meta name="description" content="有关辩论、问答、消遣、××——那些构成我的爱好。" />
    <meta name="theme-color" content="#2a1324" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- How a shared link looks (og.jpg: the home page's view by day) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="游戏之致西柚" />
    <meta property="og:title" content="游戏之致西柚 · Jeu de pamplemousse" />
    <meta property="og:description" content="有关辩论、问答、消遣、××——那些构成我的爱好。" />
    <meta property="og:url" content="https://yxzzxy.com/" />
    <meta property="og:image" content="https://yxzzxy.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div id="loader" class="loader">
      <div class="loader-inner">
        <span class="loader-word">PAMPLEMOUSSE</span>
        <span class="loader-bar"><i></i></span>
      </div>
    </div>

    <div class="ui">
      <header class="topbar">
        <div class="brand">
          <!-- The polaroid also holds the picture quality (画质): app.js deals its prints -->
          <button class="brand-box" id="quality-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="quality" aria-label="画质" title="画质"><i aria-hidden="true">游</i></button>
          <a class="brand-text" href="#/home" data-nav="home">
            <b>游戏之致西柚</b>
            <small>JEU DE PAMPLEMOUSSE</small>
          </a>
          <div class="quality" id="quality" role="radiogroup" aria-label="画质" inert>
            <div class="q-prints"></div>
            <p class="q-slip"><b class="q-name"></b><span class="q-note"></span><small class="q-foot"></small></p>
          </div>
        </div>
        <p class="credits">
          Debate · Quiz · Games · <span class="redact" role="img" aria-label="（涂黑）"></span><br />
          Imagine the clouds dripping.<br />
          Dig a hole in your garden to put them in.
        </p>
        <nav class="nav" id="nav"></nav>
        <button class="daynight" id="daynight" type="button" aria-label="切换昼夜">
          <span class="dn-track"><span class="dn-sun"></span><span class="dn-moon"></span></span>
          <span class="dn-label">DAY</span>
        </button>
        <div class="palette" id="palette">
          <button class="pal-btn" type="button" aria-haspopup="true" aria-expanded="false" title="切换配色（P）">
            <span class="pal-dots"></span><span class="pal-name">配色</span>
          </button>
          <div class="pal-menu" role="menu"></div>
        </div>
      </header>

      <main class="stage" id="stage"></main>

      <!-- One hairline strip of three cells; ui.js fills in the cells and the script title
           (or, by default, one row of fine print in place of the cells: see ui.js). -->
      <footer class="bottom is-swapping" id="bottom">
        <div class="strip">
          <div class="strip-rule strip-rule--top"><span class="strip-script"></span></div>
          <div class="strip-cells"></div>
          <div class="strip-rule strip-rule--bottom"><span class="hint" id="hint">滚轮 / ← → 切换建筑</span></div>
        </div>
      </footer>

      <!-- A card's close-up: the boarding pass where the camera lands (app.js fills it in) -->
      <section class="spot" id="spot" aria-hidden="true"></section>
    </div>

    <!-- Leaving for a card's site: the screen goes to that site's own first colour (see board() in app.js) -->
    <div class="takeoff" id="takeoff" aria-hidden="true"><span class="takeoff-ring"></span><span class="takeoff-seal"></span><span class="takeoff-motto"></span></div>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-scrim" data-close></div>
      <div class="drawer-panel">
        <button class="drawer-close" type="button" data-close aria-label="关闭">×</button>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
