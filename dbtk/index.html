    <!-- 从小镇的转场进来（它留了 youxizhi-arrive 记号）：页面先藏着，底色是屏的黑，等 src/dbtk/arrive.js 画好转场最后那块屏 -->
    <script>
      try {
        if (sessionStorage.getItem('youxizhi-arrive')) {
          document.documentElement.classList.add('is-arriving');
          setTimeout(() => document.documentElement.classList.remove('is-arriving'), 3000);
        }
      } catch (e) {}
    </script>
    <style>
      html.is-arriving { background: #070807; }
      html.is-arriving #app { visibility: hidden; }
    </style>
  </head>
